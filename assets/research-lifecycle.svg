<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
<title id="t">Research lifecycle</title><desc id="d">Six-stage lifecycle from scoping through ethics, method, validation, publication and responsible translation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081d32"/><stop offset=".62" stop-color="#0f3550"/><stop offset="1" stop-color="#14566a"/></linearGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#176b82"/><stop offset=".5" stop-color="#38a6b5"/><stop offset="1" stop-color="#d7a653"/></linearGradient>
<radialGradient id="glow" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#38a6b5" stop-opacity=".28"/><stop offset="1" stop-color="#38a6b5" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fc3d1"/></marker>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="800" rx="28" fill="url(#bg)"/><rect width="1200" height="800" rx="28" fill="url(#dots)"/><rect width="1200" height="800" rx="28" fill="url(#glow)"/>
<rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>
<text x="60" y="62" font-size="17" font-weight="800" fill="#69c2ca" text-anchor="start" letter-spacing="2.5">RESEARCH LIFECYCLE</text>
<text x="60" y="104" font-size="34" font-weight="750" fill="#fff" text-anchor="start">From question to responsible translation</text>
<line x1="120" y1="300" x2="1080" y2="300" stroke="#9fc3d1" stroke-opacity="0.45" stroke-width="3"/>
<circle cx="120" cy="300" r="40" fill="#081d32" stroke="#38a6b5" stroke-width="4"/>
<text x="120" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<rect x="34" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#38a6b5" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="120" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Scope</text>
<text x="120" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Define question,</text>
<text x="120" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">team &amp; resources</text>
<line x1="120" y1="340" x2="120" y2="372" stroke="#38a6b5" stroke-opacity="0.8" stroke-width="2"/>
<circle cx="312" cy="300" r="40" fill="#081d32" stroke="#38a6b5" stroke-width="4"/>
<text x="312" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<rect x="226" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#38a6b5" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="312" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Approve</text>
<text x="312" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Ethics, data &amp;</text>
<text x="312" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">conflicts review</text>
<line x1="312" y1="340" x2="312" y2="372" stroke="#38a6b5" stroke-opacity="0.8" stroke-width="2"/>
<circle cx="504" cy="300" r="40" fill="#081d32" stroke="#176b82" stroke-width="4"/>
<text x="504" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<rect x="418" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#176b82" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="504" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Design</text>
<text x="504" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Methods, data</text>
<text x="504" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">governance,</text>
<text x="504" y="498" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">protocols</text>
<line x1="504" y1="340" x2="504" y2="372" stroke="#176b82" stroke-opacity="0.8" stroke-width="2"/>
<circle cx="696" cy="300" r="40" fill="#081d32" stroke="#d7a653" stroke-width="4"/>
<text x="696" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<rect x="610" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#d7a653" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="696" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Validate</text>
<text x="696" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Analysis,</text>
<text x="696" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">reproducibility</text>
<text x="696" y="498" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">checks</text>
<line x1="696" y1="340" x2="696" y2="372" stroke="#d7a653" stroke-opacity="0.8" stroke-width="2"/>
<circle cx="888" cy="300" r="40" fill="#081d32" stroke="#d7a653" stroke-width="4"/>
<text x="888" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<rect x="802" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#d7a653" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="888" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Publish</text>
<text x="888" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Peer review,</text>
<text x="888" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">authorship, open</text>
<text x="888" y="498" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">science</text>
<line x1="888" y1="340" x2="888" y2="372" stroke="#d7a653" stroke-opacity="0.8" stroke-width="2"/>
<circle cx="1080" cy="300" r="40" fill="#081d32" stroke="#5fbf8f" stroke-width="4"/>
<text x="1080" y="311" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<rect x="994" y="372" width="172" height="170" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#5fbf8f" stroke-opacity="0.6" stroke-width="1.8"/>
<text x="1080" y="414" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">Translate</text>
<text x="1080" y="448" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">Responsible</text>
<text x="1080" y="473" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">innovation &amp;</text>
<text x="1080" y="498" font-size="16" font-weight="500" fill="#c9dce5" text-anchor="middle">transfer</text>
<line x1="1080" y1="340" x2="1080" y2="372" stroke="#5fbf8f" stroke-opacity="0.8" stroke-width="2"/>
<rect x="242" y="190" width="140" height="34" rx="17" fill="#d7a653" fill-opacity="0.18" stroke="#d7a653" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="312" y="213" font-size="13.5" font-weight="800" fill="#f0dca8" text-anchor="middle" letter-spacing="1.5">ETHICS GATE</text>
<line x1="312" y1="224" x2="312" y2="258" stroke="#d7a653" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 5"/>
<rect x="616" y="190" width="160" height="34" rx="17" fill="#d7a653" fill-opacity="0.18" stroke="#d7a653" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="696" y="213" font-size="13.5" font-weight="800" fill="#f0dca8" text-anchor="middle" letter-spacing="1.5">INTEGRITY CHECK</text>
<line x1="696" y1="224" x2="696" y2="258" stroke="#d7a653" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M1080 560 C1080 650 1080 660 960 660 L240 660 C120 660 120 650 120 570" fill="none" stroke="#69c2ca" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/>
<rect x="390" y="640" width="420" height="40" rx="20" fill="#081d32" fill-opacity="1" stroke="#69c2ca" stroke-opacity="0.6" stroke-width="1.3"/>
<text x="600" y="666" font-size="15.5" font-weight="650" fill="#bfeaee" text-anchor="middle">Lessons &amp; results inform new research questions</text>
<text x="60" y="766" font-size="16" font-weight="500" fill="#9fb8c7" text-anchor="start">Governed by approved ethics, data, IP and publication regulations.</text>
</svg>
